name: secrets-scan

# שכבה שנייה מעל ה-hook המקומי.
#
# למה שתיהן ולא אחת: ה-hook ב-.git/hooks/ אינו במעקב git, ולכן הוא חי בשיבוט
# אחד בלבד. שיבוט חדש, סשן על מכונה אחרת, או `git commit --no-verify` עוקפים
# אותו בלי להשאיר סימן. ה-workflow הזה רץ אחרי שהקוד כבר בשרת ולכן אינו מונע
# את הדחיפה — אבל הוא זה שאומר שהיא קרתה.
#
# ⚠ הוא מדווח, לא מונע. מה שעוצר סוד **לפני** שהוא נכנס להיסטוריה הוא
#   Push Protection בהגדרות הריפו, וזו הפעלה בדפדפן שאין ל-workflow דרך לבצע.
#
# אותו קובץ בדיוק כמו ה-hook — scripts/pre-commit-secrets.sh — כדי שלא יהיו
# שתי רשימות תבניות שנפרדות זו מזו עם הזמן.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      # מוצמד ל-SHA ולא לתג — אותו נימוק שכתוב בשאר ה-workflows (CVE-2025-30066).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          # צריך את ההיסטוריה כדי להשוות טווח, לא רק את הקומיט האחרון.
          fetch-depth: 0
          persist-credentials: false

      - name: סריקת הקומיטים שנדחפו
        run: |
          set -eu
          # push רגיל: הטווח שבין מה שהיה למה שיש. דחיפה ראשונה לענף מגיעה עם
          # before מאופס, ואז אין טווח להשוות אליו — סורקים את הקומיט האחרון.
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            RANGE="HEAD~1..HEAD"
            git cat-file -e 'HEAD~1^{commit}' 2>/dev/null || RANGE="HEAD"
          else
            RANGE="$BEFORE..${{ github.sha }}"
          fi
          echo "סורק טווח: $RANGE"
          sh scripts/pre-commit-secrets.sh "$RANGE"
          echo "נקי."
