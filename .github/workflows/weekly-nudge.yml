name: תזכורת שבועית

# 13 מתוך 15 שנרשמו לא תרגלו מעולם. אין שום ערוץ שמגיע אליהם אחרי שסגרו את הלשונית:
# התראות דחיפה דורשות הרשאה שרובם לא נתנו, והאפליקציה עצמה לא נפתחת. המייל הוא הערוץ
# היחיד שיש לנו כתובת אליו — וזו הבעיה היחידה ברשימה שמסבירה את המספר הזה.
#
# מה שולט מי מקבל, ולמה כל תנאי
# -------------------------------
#   · לא ויתר                         — הסכמה. חובה חוקית, ובלעדיה זה ספאם.
#   · לא קיבל בשבעת הימים האחרונים    — ריצה כפולה (retry, הפעלה ידנית) לא תשלח פעמיים.
#   · לא נכנס בשבעת הימים האחרונים    — מי שכבר מתרגל לא צריך שיזכירו לו.
#   · קיבל פחות מ-4 תזכורות           — מי שקיבל ארבע ולא חזר לא יחזור בגלל החמישית,
#                                        וההמשך פוגע במוניטין הדומיין ולכן גם במי שכן.
#   · יש לו מה לחזק                    — "12 מילים עומדות ליפול" חייב להיות מספר אמיתי.
#                                        למי שאין, אין מה לומר, ומייל ריק גרוע משתיקה.
#
# DRY_RUN
# --------
# ברירת המחדל היא true. הריצה מחשבת הכול, מדפיסה את הרשימה ואינה שולחת דבר. מייל שיוצא
# ל-15 אנשים אמיתיים הוא פעולה שאי אפשר לבטל — הרשימה נראית לפני ולא אחרי.
# להפעלה אמיתית: Run workflow ← dry_run = false.
#
# שני סודות, שניהם כבר קיימים בריפו הזה:
#   SUPABASE_SERVICE_KEY · RESEND_API_KEY

on:
  schedule:
    - cron: '0 6 * * 0'          # ראשון 06:00 UTC = 09:00 בישראל
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'להריץ בלי לשלוח'
        type: boolean
        default: true
      preview_to:
        description: 'תצוגה מקדימה — כתובת אחת שתקבל את המייל במקום כל הרשימה'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  nudge:
    runs-on: ubuntu-latest
    steps:
      # מוצמד ל-SHA ולא לתג. תג הוא מצביע שהמתחזק יכול להזיז, ו-CVE-2025-30066
      # הראה בדיוק את זה: גרסה זדונית נדחפה לתג קיים ושפכה את זיכרון ה-Runner —
      # כולל סודות — ללוגי הבנייה. הריפו הזה ציבורי, ולוגים של ריפו ציבורי גלויים לכל.
      # לעדכון: gh api repos/actions/checkout/git/ref/tags/v4 --jq .object.sha
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          # ה-job הזה קורא בלבד ואינו דוחף חזרה. בלי זה הטוקן נשאר כתוב
          # ב-.git/config לאורך כל הריצה, זמין לכל צעד שבא אחריו.
          persist-credentials: false

      - name: מי אמור לקבל
        id: pick
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          [ -n "${KEY:-}" ] || { echo "::error::SUPABASE_SERVICE_KEY חסר"; exit 1; }
          BASE="${URL:-https://oycypbnzcvtjliovfsxn.supabase.co}"
          H=(-H "apikey: $KEY" -H "Authorization: Bearer $KEY")

          code=$(curl -sS -o profiles.json -w '%{http_code}' "${H[@]}" \
            "$BASE/rest/v1/profiles?select=id,email,username,last_seen,nudge_optout,nudge_last_sent,nudge_count")
          # 42703 = עמודה לא קיימת. זו לא תקלה זמנית אלא מיגרציה שלא רצה, וההודעה חייבת
          # לומר את זה במפורש — אחרת מישהו ינסה שוב מחר ויקבל את אותו כלום.
          if [ "$code" != "200" ]; then
            echo "::error::profiles החזירה HTTP $code"
            grep -q 42703 profiles.json 2>/dev/null && \
              echo "::error::migrations/15.sql טרם רצה — הרץ אותה ב-Supabase SQL Editor"
            exit 1
          fi
          # רק שני השדות שהבורר קורא. `data` המלא מכיל גם assoc — האסוציאציות הפרטיות
          # שהלומד כתב לעצמו — ומשיכה שלו מורידה אותן לדיסק של runner ציבורי. הבדיקה
          # ב-19-admin-privacy סורקת את store.js בלבד, ולכן הדלת הזאת נשארה מחוץ לשדה
          # הראייה שלה. הנימוק שלה תקף גם כאן: שורה שהגיעה — נראתה.
          curl -sS -o progress.json "${H[@]}"             "$BASE/rest/v1/progress?select=user_id,lang,stats:data->stats,exam:data->extras->exam"
          # רק user_id — ספירה בלבד, בלי endpoint ובלי מפתחות. המספר מכריע אם
          # push-daily מקבל לוח זמנים או מושבת (ראה scripts/activity.py).
          curl -sS -o push.json "${H[@]}" "$BASE/rest/v1/push_sub?select=user_id"
          python3 scripts/pick_nudges.py

      # שורת מדד אחת ללוג, בלי PII. if: always() — גם ריצה שנכשלה בבחירה עדיין
      # מדפיסה את מה שיש; הסקריפט עצמו אינו נופל על קובץ חסר אלא כותב זאת.
      - name: פעילות
        if: always()
        run: python3 scripts/activity.py

      - name: שליחה
        if: steps.pick.outputs.count != '0'
        env:
          # כתובת תצוגה מקדימה משביתה את הריצה היבשה: מי שביקש לראות את המייל בתיבה
          # שלו התכוון שיישלח מייל אחד, ולא שתודפס עוד שורת לוג.
          DRY: ${{ (inputs.dry_run == false || inputs.preview_to != '') && 'false' || 'true' }}
          PREVIEW: ${{ inputs.preview_to }}
          RESEND: ${{ secrets.RESEND_API_KEY }}
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scripts/send_nudges.py
