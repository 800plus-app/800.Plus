name: מייל הפעלה

# מייל חד-פעמי למי שנרשם ולא פתח את האפליקציה מעולם. קהל אחר מהתזכורת השבועית:
# לתזכורת נכנס רק מי שיש לו "מילים לחיזוק", ולמי שלא פתח מעולם אין אף מילה — ולכן
# היא מדלגת עליו לנצח. המייל כאן הוא הזמנה ראשונה, לא תזכורת.
#
# ⚠ ההערה כאן כתבה "ידני בלבד — אין schedule בכוונה (חגי, 4.8.2026)" בזמן ש-schedule
# יושב מתחתיה. זו לא הייתה סתירה אלא הערה שהתיישנה: חגי אישר אוטומציה ב-5.8.2026,
# יום אחרי. ההחלטה המאוחרת גוברת, והשורה הוסרה כדי שלא תקרא כאיסור.
# ההגנה מפני שליחה כפולה היא cooldown של 7 ימים על nudge_last_sent, והיא בבורר.
#
# סדר ההפעלה הבטוח:
#   1. Run workflow כמו שהוא (dry_run=true) — רואים את הרשימה, שום דבר לא נשלח.
#   2. Run workflow עם preview_to=<הכתובת שלך> — מייל אחד אליך, לבדוק עברית וספאם.
#   3. Run workflow עם dry_run=false — שליחה אמיתית לכל הרשימה.
#
# שני סודות, שניהם כבר קיימים בריפו: SUPABASE_SERVICE_KEY · RESEND_API_KEY

on:
  # חגי אישר אוטומציה ב-5.8.2026. ראשון 07:00 UTC = 10:00 בישראל — שעה אחרי התזכורת
  # השבועית (06:00 UTC), כדי ששני מיילים לא ייצאו באותו רגע לאותה תיבה.
  # ⛔ כאן ישבה הבטחה שקרית: "שני הקהלים אינם חופפים ... אדם אחד לא יקבל את שניהם".
  # היא נשענה על כך ש-last_seen ריק פירושו "לא פתח מעולם", וזה לא נכון — השדה נכתב
  # רק כשמקלידים סיסמה, והלקוח שומר הפעלה. לומד פעיל בלי last_seen נבחר לשתי הרשימות
  # ומקבל את שני המיילים באותו בוקר. שוחזר על פיקסטורה.
  # ⭐ מה שמונע את זה עכשיו: הבורר דורש שני אותות — אין last_seen וגם לא נפגשה אף
  # מילה — ולכן הוא זקוק ל-progress.json. בלעדיו הוא נופל ואינו שולח.
  schedule:
    - cron: '0 7 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'להריץ בלי לשלוח'
        type: boolean
        default: true
      preview_to:
        description: 'תצוגה מקדימה — כתובת אחת שתקבל את המייל במקום כל הרשימה'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      # מוצמד ל-SHA ולא לתג. תג הוא מצביע שהמתחזק יכול להזיז, ו-CVE-2025-30066
      # הראה בדיוק את זה: גרסה זדונית נדחפה לתג קיים ושפכה את זיכרון ה-Runner —
      # כולל סודות — ללוגי הבנייה. הריפו הזה ציבורי, ולוגים של ריפו ציבורי גלויים לכל.
      # לעדכון: gh api repos/actions/checkout/git/ref/tags/v4 --jq .object.sha
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          # ה-job הזה קורא בלבד ואינו דוחף חזרה. בלי זה הטוקן נשאר כתוב
          # ב-.git/config לאורך כל הריצה, זמין לכל צעד שבא אחריו.
          persist-credentials: false

      - name: מי אמור לקבל
        id: pick
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          [ -n "${KEY:-}" ] || { echo "::error::SUPABASE_SERVICE_KEY חסר"; exit 1; }
          BASE="${URL:-https://oycypbnzcvtjliovfsxn.supabase.co}"
          H=(-H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          # רק השדות שהבורר קורא — לא data המלא, מאותו נימוק כמו weekly-nudge:
          # שורה שהגיעה ל-runner ציבורי — נראתה.
          code=$(curl -sS -o profiles.json -w '%{http_code}' "${H[@]}" \
            "$BASE/rest/v1/profiles?select=id,email,username,last_seen,nudge_optout,nudge_last_sent,nudge_count")
          if [ "$code" != "200" ]; then
            echo "::error::profiles החזירה HTTP $code"; exit 1
          fi
          # ⛔ האות השני של הבורר. בלי הקובץ הזה הוא נופל ואינו שולח, בכוונה:
          # last_seen ריק אינו "לא פתח מעולם", וההתקדמות היא מה שמכריע.
          # אותה שאילתה כמו ב-weekly-nudge.yml, בלי exam ובלי lang.
          code=$(curl -sS -o progress.json -w '%{http_code}' "${H[@]}" \
            "$BASE/rest/v1/progress?select=user_id,stats:data->stats")
          if [ "$code" != "200" ]; then
            echo "::error::progress החזירה HTTP $code"; exit 1
          fi
          python3 scripts/pick_inactive.py

      - name: שליחה
        if: steps.pick.outputs.count != '0'
        env:
          # כתובת תצוגה מקדימה משביתה את הריצה היבשה: מי שביקש לראות את המייל בתיבה
          # שלו התכוון שיישלח מייל אחד, ולא שתודפס עוד שורת לוג.
          # github.event_name במפורש, ולא הסתמכות על כך ש-inputs.dry_run ריק בריצה
          # מתוזמנת ו-'' == false מתפרש כאמת. הכרעה בין "שולח" ל"לא שולח" לא צריכה
          # להישען על המרת טיפוסים שקטה.
          DRY: ${{ (github.event_name == 'schedule' || inputs.dry_run == false || inputs.preview_to != '') && 'false' || 'true' }}
          PREVIEW: ${{ inputs.preview_to }}
          RESEND: ${{ secrets.RESEND_API_KEY }}
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scripts/send_activation.py
