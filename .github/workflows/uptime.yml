name: uptime

# Checks that 800-plus.com is actually serving the app, and emails when it is not.
#
# כמה זמן באמת עובר בין בדיקות — וזה לא מה שכתוב ב-cron
# ------------------------------------------------------
# ה-cron מבקש כל 15 דקות. GitHub אינו מתחייב לזה, ובמאגר הזה הוא לא עומד בו אפילו
# בקירוב: 2.8.2026 נמדדו ריצות ב-16:04, 20:14, 23:41, 07:53 — פערים של 3.5 עד 8 שעות.
# תזמונים תכופים ב-Actions הם "best effort" ונזרקים תחת עומס, וככל שמבקשים תכוף יותר
# כך נזרקים יותר.
#
# המשמעות המעשית: האתר יכול ליפול ולהישאר נפול שמונה שעות לפני שהבדיקה הזאת תבחין.
# זה עדיין טוב יותר מכלום, וזה אינו ניטור. ניטור אמיתי חייב לרוץ מחוץ ל-Actions —
# migrations/16.sql מקים אותו על pg_cron בתוך Supabase, שם התזמון מובטח.
#
# השלב "כמה זמן עבר" מדפיס את הפער בפועל בכל ריצה, כדי שהמספר יהיה גלוי ולא הנחה.
#
# ONE secret is needed, and only for the alert mail:
#   RESEND_API_KEY   — Settings → Secrets and variables → Actions → New repository secret
# Without it the check still runs and still fails loudly in the Actions tab; it just
# cannot send mail. That is deliberate: a monitor that silently stops monitoring
# because a key expired is worse than no monitor.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # הפער בין הריצה הזאת לקודמת, מודפס. בלעדיו הטענה "כל 15 דקות" נשארת בקובץ
      # ואיש לא מגלה שהיא לא נכונה עד שהאתר נופל.
      - name: כמה זמן עבר מהבדיקה הקודמת
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prev=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/uptime.yml/runs?per_page=2" \
                   --jq '.workflow_runs[1].created_at' 2>/dev/null)
          if [ -n "$prev" ] && [ "$prev" != "null" ]; then
            gap=$(( ( $(date -u +%s) - $(date -u -d "$prev" +%s) ) / 60 ))
            echo "הבדיקה הקודמת רצה לפני $gap דקות (ה-cron מבקש 15)"
            [ "$gap" -gt 60 ] && echo "::warning::פער של $gap דקות — GitHub מדלג על התזמון"
          fi
          exit 0

      - name: Probe the site
        id: probe
        run: |
          set +e
          URL="https://800-plus.com/"
          # Five attempts, 45s apart — a three-minute window before declaring it down.
          #
          # ⚠ למה השתנה מ-3×20 (6.8.2026). הריצה של 16:16 נכשלה, והאתר לא היה נפול:
          # באותה דקה בדיוק רצה פריסת Pages של קומיט חדש. חלון ה-redeploy ארוך
          # מדקה, וההגדרה הישנה כיסתה 60 שניות בלבד — כלומר **כל פריסה** יכלה לשלוח
          # התראת נפילה שקרית. מוניטור שצועק זאב נעשה מושתק, וזה זהה לאין מוניטור;
          # זה כתוב כאן למעלה, והמדידה הראתה שההגדרה לא עמדה בזה.
          #
          # שלוש דקות אינן מאחרות גילוי אמיתי בשום צורה משמעותית: ה-cron עצמו מדלג
          # ומייצר פערים של שעות, כפי שכתוב בראש הקובץ.
          for i in 1 2 3 4 5; do
            body=$(curl -sS --max-time 20 -w '\n%{http_code}' "$URL" 2>/dev/null)
            code=$(printf '%s' "$body" | tail -n1)
            html=$(printf '%s' "$body" | sed '$d')
            # 200 is not enough: a parked page or an error page also returns 200.
            # The app is up only if the page it serves is actually the app.
            if [ "$code" = "200" ] && printf '%s' "$html" | grep -q 'UNIT_DATA\|800+'; then
              echo "ok=true"  >> "$GITHUB_OUTPUT"
              echo "up on attempt $i (HTTP $code)"
              exit 0
            fi
            echo "attempt $i: HTTP $code"
            sleep 45
          done
          echo "ok=false" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Email the owner
        if: steps.probe.outputs.ok == 'false'
        env:
          KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning::RESEND_API_KEY is not set — cannot send the alert mail"
            exit 1
          fi
          curl -sS -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "from": "800+ <admin@800-plus.com>",
              "to": ["03hagay@gmail.com"],
              "subject": "800-plus.com לא עונה",
              "html": "<div dir=\"rtl\" style=\"font:16px/1.7 Arial,sans-serif;color:#2c2620\"><p><b>האתר לא ענה בשלוש בדיקות רצופות.</b></p><p>קוד אחרון: '"${{ steps.probe.outputs.code }}"'</p><p>מה לבדוק: GitHub Pages פעיל · הדומיין מפנה נכון · סופאבייס לא נפל.</p><p style=\"color:#8d8274;font-size:13px\">הבדיקה רצה ב-GitHub Actions, שמדלג על תזמונים תכופים — הפער בפועל הוא שעות ולא דקות.</p></div>"
            }'
          echo "alert sent"

      - name: Fail the run so it is visible in the Actions tab
        if: steps.probe.outputs.ok == 'false'
        run: exit 1
