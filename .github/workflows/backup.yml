name: backup (הועבר)

# הגיבוי כבר לא רץ מכאן. הוא חי ב-Hagay-BOT/800plus-backups.
#
# למה
# ----
# הגרסה שרצה כאן דחפה dump של חמש טבלאות לענף `backups` של הריפו הזה, עם כותרת
# שכתוב בה "ענף פרטי". ענף אינו גבול פרטיות. כל ענף של ריפו ציבורי הוא ציבורי,
# והריפו הזה ציבורי — כי GitHub Pages מגיש ממנו את 800-plus.com. ריצה ידנית אחת
# פרסמה 14 כתובות מייל, 16 בלובי התקדמות הכוללים אסוציאציות פרטיות, 3 דיווחים עם
# User-Agent, ו-12 שורות אסוציאציות עם user_id. הענף נמחק ב-2.8.2026.
#
# להפוך את הריפו הזה לפרטי אינו פתרון: זה היה מוריד את האתר, כי Pages מריפו פרטי
# דורש מנוי בתשלום.
#
# למה דווקא שם, ולא כאן עם דחיפה לשם
# ------------------------------------
# ה-workflow יושב באותו ריפו שאליו הוא כותב, ולכן ה-GITHUB_TOKEN המובנה מספיק לו.
# הגרסה שרצה כאן הייתה זקוקה ל-Personal Access Token חוצה-ריפו — טוקן ארוך-חיים,
# בהרשאה רחבה, ששוכב בסודות של ריפו ציבורי. פחות חלקים נעים, פחות מה שידלוף.
#
# הקובץ הזה נשאר כמצבה מכוונת: מי שיחפש כאן "איפה הגיבוי" ימצא תשובה, במקום
# היסטוריית git ריקה.
#
#   הגדרות ותיעוד:  https://github.com/Hagay-BOT/800plus-backups
#   הסוד היחיד שם:  SUPABASE_SERVICE_KEY

on:
  workflow_dispatch:

# ה-job הזה רק מדפיס שגיאה ויוצא. אפס הרשאות הוא בדיוק מה שמגיע לו.
permissions: {}

jobs:
  moved:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::הגיבוי הועבר ל-Hagay-BOT/800plus-backups. אל תפעיל אותו מכאן."
          exit 1
