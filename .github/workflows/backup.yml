name: backup

# ⛔ DISABLED 1.8.2026 — house-check 2, finding #1. Do not re-enable without reading this.
#
# WHAT WENT WRONG
# ---------------
# The header used to say the dump went to "a private branch of this repo". A BRANCH IS NOT A
# PRIVACY BOUNDARY. Every branch of a public repository is public, and this repository is public
# (verified unauthenticated: the API returns "private": false) because GitHub Pages serves
# 800-plus.com from it. So one manual run published 14 email addresses, 16 progress blobs
# including private associations, 3 feedback rows with User-Agent strings, and 12 association
# rows carrying user_id — to anyone who runs `git clone`.
#
# The schedule is removed rather than commented out, so it cannot be re-armed by deleting a
# `#`. The preflight step below now refuses to run at all unless the repository is private,
# which makes the original mistake structurally impossible rather than merely documented.
#
# WHAT IS STILL WRONG UNTIL SOMEONE ACTS
# --------------------------------------
# The `backups` branch still exists and still holds that data:
#     git push origin --delete backups
# Disabling this workflow stops NEW dumps. It does not remove the one already published.
#
# BEFORE RE-ENABLING — pick a destination, because each has a real cost:
#   1. A separate PRIVATE repo + a PAT in Secrets. Cleanest. Needs a repo created by hand.
#   2. Encrypt before committing (gpg --symmetric, passphrase in Secrets). No new repo — but a
#      lost passphrase means an unrestorable backup, and "a backup that was never restored is
#      not a backup, it is a promise" is the finding right next to this one.
#   3. External object storage (S3 / Drive). Most work, fewest surprises.
# Making THIS repo private is not on the list: it would take 800-plus.com down, because Pages
# from a private repo requires a paid plan.
#
# ONE secret is needed:
#   SUPABASE_SERVICE_KEY  — Supabase → Project Settings → API → service_role
#   Settings → Secrets and variables → Actions → New repository secret
#
# ⚠ That key can read and write everything. It belongs ONLY in GitHub Secrets — never in a
#   file, never in a commit, never pasted into a chat. GitHub masks it in logs automatically.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      # The guard that should have existed from the first line of this file. It is deliberately
      # the FIRST step, before the checkout and long before the service key is in the environment:
      # a run that must not happen must not get as far as holding the key.
      - name: Refuse to write user data into a public repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          vis=$(gh repo view ${{ github.repository }} --json visibility --jq .visibility)
          echo "repository visibility: $vis"
          if [ "$vis" != "PRIVATE" ]; then
            echo "::error::${{ github.repository }} is $vis. A branch is not a privacy boundary —"
            echo "::error::every branch of a public repo is public. Refusing to dump user data."
            echo "::error::See the header of this file for the three destinations to choose from."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: backups
          fetch-depth: 1
        continue-on-error: true       # first ever run: the branch does not exist yet

      - name: Prepare the branch
        run: |
          git config user.name  "backup-bot"
          git config user.email "actions@github.com"
          if ! git rev-parse --verify backups >/dev/null 2>&1; then
            git checkout --orphan backups
            git rm -rf . >/dev/null 2>&1 || true
            echo "גיבויים יומיים של בסיס הנתונים. לא לערוך ידנית." > README.md
          fi
          mkdir -p data

      - name: Pull every table
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${KEY:-}" ]; then
            echo "::error::SUPABASE_SERVICE_KEY is not set — nothing was backed up"
            exit 1
          fi
          BASE="${URL:-https://oycypbnzcvtjliovfsxn.supabase.co}"
          for t in profiles progress feedback subscription assoc_shared; do
            out="data/$t.json"
            code=$(curl -sS -o "$out" -w '%{http_code}' \
              "$BASE/rest/v1/$t?select=*" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
            if [ "$code" != "200" ]; then
              # a table that does not exist is not a failure; a table that exists and
              # refuses to answer is, and the difference must not be swallowed
              if [ "$code" = "404" ]; then
                echo "::notice::$t does not exist in this project — skipped"
                rm -f "$out"
                continue
              fi
              echo "::error::$t returned HTTP $code"
              exit 1
            fi
            n=$(python3 -c "import json,sys;print(len(json.load(open('$out'))))")
            echo "  $t: $n rows"
            # A table that had rows yesterday and none today is the exact shape of a
            # disaster. Refuse to overwrite a good backup with an empty one.
            if [ "$n" = "0" ] && [ -s "data/$t.count" ] && [ "$(cat "data/$t.count")" != "0" ]; then
              echo "::error::$t came back empty but had $(cat "data/$t.count") rows yesterday — refusing to overwrite"
              exit 1
            fi
            echo "$n" > "data/$t.count"
          done

      - name: Commit
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed today"
            exit 0
          fi
          git commit -m "גיבוי $(date -u '+%Y-%m-%d')"
          git push origin backups
