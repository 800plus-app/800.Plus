<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>800+ · סטורי שליפה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
/* סטורי סטטי · שינון מול שליפה. 1080×1920.

   המסר היחיד: תפסיק לתרגל מילים מתוך שינון. תתחיל לשלוף מהראש.

   הניסוח של חגי מסטורי ההדגמה, בגרסה סטטית. מסר שחוזר בשני פורמטים נזכר.

   המבנה חוצה את המסך לשניים: מה שעזבת למעלה בעמעום, ומה שאתה עובר אליו למטה
   בצבע ובגודל. ההשוואה נמסרת במשקל ובצבע, לא בציור ולא בכמות. */
:root{
  --paper:#f6f1e7; --card:#fffdf8; --ink:#2c2620; --ink-soft:#736a5c;
  --gold:#c9962f; --accent:#b5482e; --accent-deep:#8f3620; --line:#e3d8c4;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1712;font-family:"Heebo",sans-serif;display:flex;justify-content:center}
.stage{width:1080px;height:1920px;position:relative;background:var(--paper);overflow:hidden;
       display:flex;flex-direction:column;align-items:center;justify-content:center;
       padding:0 88px;text-align:center}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.6;
  background-image:radial-gradient(circle at 50% 12%, rgba(201,150,47,.20), transparent 44%),
                   radial-gradient(circle at 86% 86%, rgba(181,72,46,.12), transparent 46%)}
.mark{position:absolute;top:104px;font-family:"Frank Ruhl Libre",serif;font-weight:900;
      font-size:56px;letter-spacing:-.03em;color:var(--gold);direction:ltr}

/* החלק שנעזב. עמום ומחוק, כדי שהעין תעבור עליו מהר אל מה שמתחת. */
.old{position:relative;font-family:"Frank Ruhl Libre",serif;font-weight:700;font-size:66px;
     color:var(--ink-soft);line-height:1.16;opacity:.62;text-decoration:line-through;
     text-decoration-thickness:4px;text-decoration-color:rgba(181,72,46,.55)}
.arrow{position:relative;font-size:56px;color:var(--gold);margin:38px 0 34px;line-height:1}
/* החלק החדש. הוא המסר, ולכן הוא הגדול. */
.new{position:relative;font-family:"Frank Ruhl Libre",serif;font-weight:900;font-size:104px;
     color:var(--ink);line-height:1.08;letter-spacing:-.01em}
.new em{color:var(--accent);font-style:normal}

.note{position:relative;margin-top:56px;font-size:36px;color:var(--ink-soft);
      font-weight:300;line-height:1.4}
.tag{position:relative;margin-top:46px;display:inline-flex;font-size:34px;color:var(--ink);
     background:var(--card);border:2px solid var(--line);border-radius:999px;padding:18px 42px}
.tag b{font-family:"Frank Ruhl Libre",serif;font-weight:900;color:var(--accent-deep);
     /* רווח מפורש: מספר LTR צמוד למילה עברית נדבק אליה ונקרא "עד30.8" */
     margin-inline-start:10px}
.cta{position:relative;margin-top:40px;background:var(--accent);color:#fff;font-size:38px;
     font-weight:700;border-radius:999px;width:300px;padding:24px 0}
.host{position:relative;margin-top:22px;font-size:34px;color:var(--ink-soft);
      letter-spacing:.08em;direction:ltr}
</style>
</head>
<body>
<div class="stage">
  <div class="grain"></div>
  <div class="mark">800+</div>

  <div class="old">לתרגל מילים<br>מתוך שינון</div>
  <div class="arrow">↓</div>
  <!-- הניסוח של חגי, 5.8. "מהראש" הוחלף ב"בצורה אקטיבית".
       ההדגשה על "אקטיבית" בלבד ולא על "בצורה אקטיבית", לפי סעיף 3 של VIS:
       המילה שנושאת את ההבדל היא זו שמקבלת את הצבע. -->
  <div class="new">לשלוף אותן<br>בצורה <em>אקטיבית</em></div>

  <div class="note">אתה כותב את התשובה בעצמך<br>ולא בוחר מתוך רשימה</div>

  <div class="tag">חינם עד <b id="freeDate"></b></div>
  <div class="cta">להתנסות עכשיו</div>
  <div class="host">800-plus.com</div>
</div>

<script>
const FREE_UNTIL = '2026-08-30';
(function(){
  const end = new Date(FREE_UNTIL + 'T23:59:59');
  document.getElementById('freeDate').textContent = end.getDate() + '.' + (end.getMonth() + 1);
})();
</script>
</body>
</html>
