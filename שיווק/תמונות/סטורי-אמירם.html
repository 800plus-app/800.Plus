<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>800+ · סטורי אמיר"ם</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
/* הסטורי היחיד שמדבר אל מועמדי אמיר"ם, 1080×1920.

   למה הוא נפרד ולא שורה בתוך סטורי קיים: כל החומר השיווקי של 800+ פותח בפסיכומטרי —
   הפרסומת מציגה מסך ציונים ואומרת "4 מתוך 6 פרקי הפסיכומטרי". מי שניגש לאמיר"ם רואה
   את זה ומסיק שהמוצר לא בשבילו, בזמן ש-3,945 המילים באנגלית הן בדיוק המבחן שלו במלואו.
   מסר אחד לכל סטורי — וזה מסר בפני עצמו.

   ⚠ המספר נספר מ-data-en.js בזמן הרינדור ואינו מוקלד. זו אותה הגנה שיש ב-render.ps1
   של הסרטון, ומאותה סיבה: הסרטון כבר הכריז פעם על מאגר שהתיישן.
   ⚠ ולכן הקובץ חייב להיות מרונדר במקומו — הנתיב ../../data-en.js נשבר אם מעתיקים אותו
   לתיקייה זמנית. רנדר.ps1 שבתיקייה הזאת מצלם במקום. */
:root{
  --paper:#f6f1e7; --paper-deep:#efe7d6; --card:#fffdf8; --ink:#2c2620; --ink-soft:#736a5c;
  --gold:#c9962f; --accent:#b5482e; --accent-deep:#8f3620; --line:#e3d8c4;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1712;font-family:"Heebo",sans-serif;color:#f6f1e7;
     display:flex;justify-content:center;padding:0}

.stage{width:1080px;height:1920px;position:relative;background:var(--paper);overflow:hidden;
       display:flex;flex-direction:column;justify-content:center;padding:0 96px}

.grain{position:absolute;inset:0;pointer-events:none;opacity:.55;
  background-image:radial-gradient(circle at 16% 18%, rgba(201,150,47,.15), transparent 44%),
                   radial-gradient(circle at 86% 82%, rgba(181,72,46,.12), transparent 48%)}

.kick{font-size:30px;letter-spacing:.26em;color:var(--gold);font-weight:700;margin-bottom:26px}
.big{font-family:"Frank Ruhl Libre",serif;font-weight:900;color:var(--ink);
     line-height:1.06;font-size:104px;letter-spacing:-.01em}
.rule{height:4px;width:190px;background:linear-gradient(90deg,var(--gold),transparent);
      border-radius:2px;margin:44px 0 46px}

/* המספר הוא הגיבור, בדיוק כמו הספירה בסטורי ההשקה — אבל כאן התווית שלו ארוכה
   פי שלושה מ"ימים חינם", ובשורה אחת היא נשברה לשתיים והתנגשה בספרות. לכן היא יורדת
   מתחת למספר במקום לשבת לצידו. */
.count{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.num{font-family:"Frank Ruhl Libre",serif;font-weight:900;font-size:230px;line-height:.85;
     color:var(--accent);letter-spacing:-.03em;direction:ltr}
.unit{font-family:"Frank Ruhl Libre",serif;font-weight:900;font-size:70px;color:var(--ink);
      white-space:nowrap}
.sub{font-size:40px;color:var(--ink-soft);font-weight:300;margin-top:24px;line-height:1.5}

.tag{display:inline-flex;align-items:center;gap:16px;font-size:34px;color:var(--ink);
     background:var(--card);border:2px solid var(--line);border-radius:999px;
     padding:18px 34px;margin-top:56px;align-self:flex-start}
.tag b{font-family:"Frank Ruhl Libre",serif;font-weight:900;color:var(--accent-deep)}

.cta{margin-top:64px;background:var(--accent);color:#fff;font-size:46px;font-weight:700;
     border-radius:22px;padding:32px 0;text-align:center}
.host{margin-top:26px;font-size:36px;color:var(--ink-soft);text-align:center;
      letter-spacing:.08em;direction:ltr}
.mark{position:absolute;top:84px;inset-inline-start:96px;
      font-family:"Frank Ruhl Libre",serif;font-weight:900;font-size:52px;
      letter-spacing:-.03em;color:var(--gold)}
</style>
</head>
<body>
<div class="stage">
  <div class="grain"></div>
  <div class="mark"><bdi>800+</bdi></div>

  <div class="kick">מבחן אמיר"ם</div>
  <!-- "גם אמיר״ם הוא אוצר מילים" נפסל: הוא טוען טענה על המבחן שאי אפשר לאמת מול הקוד.
       מה שכן ניתן לאמת הוא מבנה המבחן והמאגר שלנו, ושניהם נאמרים כאן ישירות. -->
  <div class="big">אמיר"ם הוא<br>אנגלית בלבד</div>
  <div class="rule"></div>

  <div class="count">
    <div class="num" id="cNum">—</div>
    <div class="unit">מילים באנגלית</div>
  </div>
  <div class="sub">10 יחידות מדורגות לפי רמת קושי</div>

  <div class="tag" id="freeTag">חינם עד <b id="freeDate"></b> · בלי כרטיס אשראי</div>

  <div class="cta">להתנסות עכשיו</div>
  <div class="host">800-plus.com</div>
</div>

<!-- המאגר עצמו. נטען כדי לספור, לא כדי להציג. -->
<script src="../../data-en.js"></script>
<script>
/* התאריך שבו נגמרת התקופה החינמית. זה הערך היחיד לעדכן. */
const FREE_UNTIL = '2026-08-30';

(function(){
  /* המספר נספר, לא מוקלד. אם data-en.js לא נטען — עדיף שהסטורי יישבר גלויות
     מאשר שיציג מספר שגוי, ולכן אין כאן ערך גיבוי. */
  const n = Object.values(window.UNIT_DATA_EN).reduce((a,u) => a + u.length, 0);
  document.getElementById('cNum').textContent = n.toLocaleString('en-US');

  /* כשהתקופה החינמית נגמרת התגית נעלמת, ולא הופכת להבטחה שכבר אינה נכונה. */
  const end = new Date(FREE_UNTIL + 'T23:59:59');
  if (new Date() > end) {
    document.getElementById('freeTag').style.display = 'none';
  } else {
    document.getElementById('freeDate').textContent = end.getDate() + '.' + (end.getMonth() + 1);
  }
})();
</script>
</body>
</html>
