<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>800+ · סטורי השקה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
/* סטורי אחד, 1080×1920, אותה פלטה של האפליקציה — מי שיגיע מכאן יזהה מיד שהגיע למקום הנכון.
   השימוש: פותחים בדפדפן, מצלמים מסך, מעלים. render.ps1 שבתיקיית הסרטונים מרנדר אותו
   לקובץ PNG בפקודה אחת.

   ⚠ המספר בספירה מחושב מ-FREE_UNTIL ואינו מוקלד. רינדור מחדש מחר ייתן את המספר הנכון
   מעצמו — ומספר שהתיישן בסטורי הוא בדיוק סוג הטעות שגורמת למישהו להפסיק להאמין למספרים
   האחרים. כשהתאריך עובר, שורת הספירה נעלמת לגמרי במקום להציג מספר שלילי. */
:root{
  --paper:#f6f1e7; --paper-deep:#efe7d6; --card:#fffdf8; --ink:#2c2620; --ink-soft:#736a5c;
  --gold:#c9962f; --accent:#b5482e; --accent-deep:#8f3620; --line:#e3d8c4;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1712;font-family:"Heebo",sans-serif;color:#f6f1e7;
     display:flex;justify-content:center;padding:0}

.stage{width:1080px;height:1920px;position:relative;background:var(--paper);overflow:hidden;
       display:flex;flex-direction:column;justify-content:center;padding:0 96px}

/* נייר, לא גרדיאנט. אותו רקע חם של האפליקציה. */
.grain{position:absolute;inset:0;pointer-events:none;opacity:.55;
  background-image:radial-gradient(circle at 16% 18%, rgba(201,150,47,.15), transparent 44%),
                   radial-gradient(circle at 86% 82%, rgba(181,72,46,.12), transparent 48%)}

.kick{font-size:30px;letter-spacing:.26em;color:var(--gold);font-weight:700;margin-bottom:26px}
.big{font-family:"Frank Ruhl Libre",serif;font-weight:900;color:var(--ink);
     line-height:1.06;font-size:104px;letter-spacing:-.01em}
.rule{height:4px;width:190px;background:linear-gradient(90deg,var(--gold),transparent);
      border-radius:2px;margin:44px 0 46px}

/* הספירה — הגיבור של המסך. */
.count{display:flex;align-items:baseline;gap:26px}
.num{font-family:"Frank Ruhl Libre",serif;font-weight:900;font-size:250px;line-height:.85;
     color:var(--accent);letter-spacing:-.03em}
.unit{font-family:"Frank Ruhl Libre",serif;font-weight:900;font-size:76px;color:var(--ink)}
.until{font-size:40px;color:var(--ink-soft);font-weight:300;margin-top:24px;line-height:1.5}

.tag{display:inline-flex;align-items:center;gap:16px;font-size:34px;color:var(--ink);
     background:var(--card);border:2px solid var(--line);border-radius:999px;
     padding:18px 34px;margin-top:56px;align-self:flex-start}
.tag b{font-family:"Frank Ruhl Libre",serif;font-weight:900;color:var(--accent-deep)}

.cta{margin-top:64px;background:var(--accent);color:#fff;font-size:46px;font-weight:700;
     border-radius:22px;padding:32px 0;text-align:center}
.host{margin-top:26px;font-size:36px;color:var(--ink-soft);text-align:center;
      letter-spacing:.08em;direction:ltr}
.mark{position:absolute;top:84px;inset-inline-start:96px;
      font-family:"Frank Ruhl Libre",serif;font-weight:900;font-size:52px;
      letter-spacing:-.03em;color:var(--gold)}
</style>
</head>
<body>
<div class="stage">
  <div class="grain"></div>
  <div class="mark"><bdi>800+</bdi></div>

  <div class="kick">אוצר מילים לפסיכומטרי</div>
  <!-- "פתחנו את הדלת לפני כולם" נפסל: נקרא בקול, הוא יוצא דו-משמעי — כאילו אנחנו
       הקדמנו את המתחרים ולא שהקורא נכנס ראשון. זה אומר את אותו דבר בלי הספק. -->
  <div class="big">עוד לא השקנו<br>אתם כבר בפנים</div>
  <div class="rule"></div>

  <div id="countBlock">
    <div class="count">
      <div class="num" id="cNum">—</div>
      <div class="unit" id="cUnit">ימים חינם</div>
    </div>
    <div class="until" id="cUntil"></div>
  </div>

  <div class="tag"><b>5,662</b> מילים · בעברית ובאנגלית</div>

  <div class="cta">להתנסות עכשיו</div>
  <div class="host">800-plus.com</div>
</div>

<script>
/* התאריך שבו נגמרת התקופה החינמית. זה הערך היחיד לעדכן. */
const FREE_UNTIL = '2026-08-30';

(function(){
  const end = new Date(FREE_UNTIL + 'T23:59:59');
  const now = new Date();
  const days = Math.ceil((end - now) / 86400000);

  /* "1 ימים" אינו עברית, וזה ההבדל בין הזמנה אישית לבאנר אוטומטי. */
  const num = document.getElementById('cNum'), unit = document.getElementById('cUnit');
  if (days > 2)       { num.textContent = days; unit.textContent = 'ימים חינם'; }
  else if (days === 2){ num.textContent = ''; unit.textContent = 'יומיים אחרונים חינם'; }
  else if (days === 1){ num.textContent = ''; unit.textContent = 'היום האחרון חינם'; }
  else                { document.getElementById('countBlock').style.display = 'none'; }

  /* התאריך אינו מתיישן כמו המספר, ולכן הוא זה שנשאר על המסך. */
  const d = end.getDate(), m = end.getMonth() + 1;
  document.getElementById('cUntil').textContent =
    days > 0 ? `עד ${d}.${m} · בלי כרטיס אשראי` : 'בלי כרטיס אשראי';
})();
</script>
</body>
</html>
