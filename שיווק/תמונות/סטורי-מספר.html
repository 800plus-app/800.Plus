<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>800+ · סטורי המספר</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
/* סטורי סטטי · המספר. 1080×1920.

   המסר היחיד: המנגנון. ⛔ מספרי מילים הוסרו 26.8.2026 לפי הוראת חגי.

   למה מנגנון ולא מספר: מספר מתיישן ונקרא כפרסומת. מנגנון אינו מתיישן.
   מכריחה את הקורא לענות לעצמו, והתשובה "אני לא יודע" היא בדיוק הרגע שבו
   הוא רוצה לבדוק. וזו גם שאלה שאפשר לענות עליה בסטיקר.

   ⚠ המספר נספר מ-data.js ומ-data-en.js בזמן הרינדור ואינו מוקלד. */
:root{
  --paper:#f6f1e7; --card:#fffdf8; --ink:#2c2620; --ink-soft:#736a5c;
  --gold:#c9962f; --accent:#b5482e; --accent-deep:#8f3620; --line:#e3d8c4;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1712;font-family:"Heebo",sans-serif;display:flex;justify-content:center}
.stage{width:1080px;height:1920px;position:relative;background:var(--paper);overflow:hidden;
       display:flex;flex-direction:column;align-items:center;justify-content:center;
       padding:0 90px;text-align:center}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.6;
  background-image:radial-gradient(circle at 50% 16%, rgba(201,150,47,.22), transparent 46%),
                   radial-gradient(circle at 84% 84%, rgba(181,72,46,.12), transparent 46%)}
.mark{position:absolute;top:104px;font-family:"Frank Ruhl Libre",serif;font-weight:900;
      font-size:56px;letter-spacing:-.03em;color:var(--gold);direction:ltr}

.kick{position:relative;font-size:30px;letter-spacing:.26em;color:var(--gold);font-weight:700}
/* המספר הוא הגיבור. הוא לבדו תופס שליש מגובה המסך. */
.num{position:relative;font-family:"Frank Ruhl Libre",serif;font-weight:900;font-size:270px;
     line-height:.88;color:var(--accent);letter-spacing:-.03em;direction:ltr;margin-top:22px}
.unit{position:relative;font-family:"Frank Ruhl Libre",serif;font-weight:900;font-size:64px;
      color:var(--ink);margin-top:8px}
.rule{position:relative;height:4px;width:200px;
      background:linear-gradient(90deg,var(--gold),transparent);border-radius:2px;margin:56px 0}
/* השאלה. היא המסר, ולכן היא גדולה כמעט כמו המספר. */
.q{position:relative;font-family:"Frank Ruhl Libre",serif;font-weight:900;font-size:82px;
   color:var(--ink);line-height:1.12}
.q em{color:var(--accent);font-style:normal}
.tag{position:relative;margin-top:60px;display:inline-flex;font-size:34px;color:var(--ink);
     background:var(--card);border:2px solid var(--line);border-radius:999px;padding:18px 42px}
.tag b{font-family:"Frank Ruhl Libre",serif;font-weight:900;color:var(--accent-deep);
     /* רווח מפורש: מספר LTR צמוד למילה עברית נדבק אליה ונקרא "עד30.8" */
     margin-inline-start:10px}
.cta{position:relative;margin-top:44px;background:var(--accent);color:#fff;font-size:38px;
     font-weight:700;border-radius:999px;width:300px;padding:24px 0}
.host{position:relative;margin-top:22px;font-size:34px;color:var(--ink-soft);
      letter-spacing:.08em;direction:ltr}
</style>
</head>
<body>
<div class="stage">
  <div class="grain"></div>
  <div class="mark">800+</div>

  <div class="kick">אוצר מילים לפסיכומטרי</div>
  <div class="num">רק מה<br>שנופל</div>
  <div class="unit">בעברית ובאנגלית</div>

  <div class="rule"></div>

  <div class="q">המילה חוזרת<br><em>כשאתה</em> עומד לשכוח</div>

  <div class="tag">אפשר להתחיל בלי הרשמה</div>
  <div class="cta">להתנסות עכשיו</div>
  <div class="host">800-plus.com</div>
</div>

<!-- ⛔ «3 ימי ניסיון חינם» הוסר 30.8.2026. הכרעת חגי מ-28.8: המוצר חינמי
     והגבייה נעצרה, ובאתר החי אין שום שער מנוי (grep על subscriptionActive|
     isSubscribed|trialExpired ב-app.js החזיר 0). «ניסיון» היה שקר שמרתיע.
     ⭐ מספר ימים ומחיר הם מדיניות שמשתנה. «אפשר להתחיל בלי הרשמה» היא
     עובדה על המוצר, ולכן היא לא מתיישנת עם ההכרעה הבאה. -->
</body>
</html>
