# קונפיגורציית Supabase לפונקציות הקצה.
#
# ⚠ השורה verify_jwt = false היא השורה שבלעדיה שום דבר לא עובד, והכשל שהיא
#   מונעת הוא הכשל השקט ביותר בכל ההטמעה:
#   Supabase Edge Functions מאמתות JWT כברירת מחדל. ספק תשלומים לא שולח JWT.
#   התוצאה היא 401 — הפונקציה שלנו לא רצה בכלל, אין שורה ב-billing_events,
#   אין שגיאה בלוגים שלנו (כי לא הגענו לקוד), והלקוח **שילם וקיבל כלום**.
#   התסמין היחיד הוא תלונה של לקוח, ימים אחר כך.
#
#   בדיקה שהשורה באמת נתפסה, אחרי כל deploy:
#     curl -i https://<ref>.supabase.co/functions/v1/billing-webhook/health
#   חייב לחזור 200 עם גוף JSON. אם חוזר 401 — verify_jwt עדיין דלוק.

[functions.billing-webhook]
verify_jwt = false

[functions.create-checkout]
verify_jwt = true
# כאן דווקא כן: רק משתמש מחובר פותח checkout, וה-user_id שיחזור ב-webhook
# נקבע בשרת מתוך ה-JWT ולא ע"י הדפדפן.
# (הפונקציה עצמה עוד לא נכתבה — ראה supabase/README.md, "מה עוד חסר".)

# מחיקת חשבון עצמית.
#
# verify_jwt = false, וזה מכוון. השער הזה בודק רק שה-JWT חתום ב-legacy
# secret — והמפתח האנונימי מספיק לו, כלומר הוא לא מזהה מי המשתמש. הפונקציה
# עושה את הבדיקה האמיתית בעצמה דרך auth.getUser(token), שמאמתת מול סופאבייס
# שהטוקן שייך למשתמש חי. זו בדיקה חזקה יותר, לא חלשה יותר.
#
# ⚠ ולהשאיר אותו דלוק היה מסוכן דווקא: בפרויקטים שחותמים במפתחות אסימטריים
#   הוא חוסם טוקנים לגיטימיים לפני שהם מגיעים לקוד, והמשתמש רואה כישלון
#   מחיקה בלי סיבה נראית.
#
# והפונקציה אינה פתוחה: בלי טוקן תקף היא מחזירה 401, ואין בגוף הבקשה מזהה
# משתמש כלל — אי אפשר לבקש ממנה למחוק מישהו אחר.
[functions.delete-account]
verify_jwt = false

# שליחת התראות דחף.
#
# ⭐ השער האמיתי כאן הוא PUSH_TRIGGER_SECRET (send-push/index.ts:119), והוא
#   נכשל-סגור: בלי הסוד הנכון אין פעולה, וההשוואה היא safeEq. verify_jwt דלוק
#   אינו מוסיף כאן אבטחה — הוא רק חוסם את הקורא הלגיטימי היחיד.
#
# ⛔ והקורא היחיד הוא .github/workflows/push-daily.yml:89-91, ששולח
#   x-trigger-secret בלבד — בלי Authorization ובלי apikey, ובצדק: לצינור
#   מתוזמן אין JWT של משתמש ולא צריך להיות לו.
#
# ⚠ בלי השורה הזאת הפונקציה נופלת לברירת המחדל verify_jwt = true, ואז הפריסה
#   עצמה מפילה את ההתראות היומיות ב-401. וזה כשל שקט: אותו workflow נכשל היום
#   ממילא ב-404, ולכן איש לא יבחין שהסיבה התחלפה.
#
# נמדד 27.8.2026: send-push מחזירה 404 (אינה פרוסה). ובאותה מדידה, שלוש בקשות
# ל-delete-account החזירו שלושה קודים שונים — NO_AUTH_HEADER, INVALID_JWT_FORMAT,
# ו-LEGACY_JWT — כלומר השער מנתח JWT, ו-verify_jwt דלוק בייצור בניגוד לקובץ הזה.
# ⭐ ולכן אימות אחרי הפריסה הוא מה שיגלה אם הקובץ בכלל הוחל.
[functions.send-push]
verify_jwt = false
